<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autonomous Company Builder</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background:#f5f5f5; color:#0b2340; }
  h1 { color: #0b2340; }
  input, button { padding: 10px; font-size: 16px; margin: 5px 0; width: 100%; max-width: 400px; }
  button { cursor: pointer; background: #0b2340; color: white; border: none; }
  button:disabled { background: #888; cursor: not-allowed; }
  #log { margin-top: 20px; padding: 10px; background: #fff; border-radius: 5px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
  .loading { display:inline-block; margin-left:10px; animation: spin 1s linear infinite; border:3px solid #ccc; border-top:3px solid #0b2340; border-radius:50%; width:16px; height:16px; vertical-align:middle; }
  @keyframes spin { 0% {transform:rotate(0deg);} 100% {transform:rotate(360deg);} }
  #downloads { margin-top: 20px; }
  a { margin-right: 10px; }
</style>
</head>
<body>
<h1>Autonomous Company Builder</h1>
<input type="text" id="industry" placeholder="Enter industry or brand name" />
<button id="generateBtn">Generate Company</button>
<span id="loadingIndicator" class="loading" style="display:none;"></span>

<div id="log"></div>
<div id="downloads" style="display:none;">
  <a id="jsonLink" href="#" target="_blank">Download JSON</a>
  <a id="pdfLink" href="#" target="_blank">Download PDF</a>
</div>

<script>
const btn = document.getElementById('generateBtn');
const industryInput = document.getElementById('industry');
const logDiv = document.getElementById('log');
const loadingIndicator = document.getElementById('loadingIndicator');
const downloadsDiv = document.getElementById('downloads');
const jsonLink = document.getElementById('jsonLink');
const pdfLink = document.getElementById('pdfLink');

function log(msg) {
  logDiv.textContent += msg + "\n";
  logDiv.scrollTop = logDiv.scrollHeight;
}

btn.addEventListener('click', async () => {
  const industry = industryInput.value.trim();
  if (!industry) return alert("Enter industry first");

  logDiv.textContent = "";
  downloadsDiv.style.display = "none";
  btn.disabled = true;
  loadingIndicator.style.display = "inline-block";

  try {
    // Call backend to start generation
    const res = await fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ industry })
    });
    const data = await res.json();
    const sseUrl = data.sseUrl;
    const projectId = data.projectId;

    // Listen to SSE events
    const evtSource = new EventSource(sseUrl);
    evtSource.onmessage = (e) => {
      const event = JSON.parse(e.data);
      if(event.stage) log(`[${event.stage}] ${event.message}`);
      if(event.stage === "pdf_done") {
        downloadsDiv.style.display = "block";
        jsonLink.href = `/download/json/${projectId}`;
        pdfLink.href = `/download/pdf/${projectId}`;
      }
      if(event.stage === "complete") {
        btn.disabled = false;
        loadingIndicator.style.display = "none";
        log("[complete] Company generation finished!");
        evtSource.close();
      }
      if(event.stage === "error") {
        log(`[ERROR] ${event.message} ${event.error||""}`);
        btn.disabled = false;
        loadingIndicator.style.display = "none";
        evtSource.close();
      }
    };
  } catch(err) {
    log("[ERROR] " + err.message);
    btn.disabled = false;
    loadingIndicator.style.display = "none";
  }
});
</script>
</body>
</html>
